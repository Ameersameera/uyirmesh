name: Build APK

# Builds and tests UyirMesh on GitHub's runners (real Android SDK + internet). The signed APK is published as a
# release named after the app version (v<versionName>) only after the unit tests AND the on-device smoke test on an
# Android 14 emulator pass. Builds from the v2-dev branch are published as a test pre-release (v<versionName>-dev);
# older releases such as v1.0 are never touched.
on:
  push:
    branches: [ main, v2-dev ]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Cache speech model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets/model
            app/src/main/assets/model_info.txt
          key: vosk-model-small-en-in-0.4-v1

      - name: Download offline speech model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: ./scripts/fetch_voice_model.sh

      - name: Refresh model id
        run: python3 -c "import uuid; print(uuid.uuid4())" > app/src/main/assets/model/uuid

      - name: Run core unit tests (mesh, crypto, AI)
        run: gradle :core:test --stacktrace

      - name: Build signed APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UyirMesh-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  # Runs the app on a real Android 14 system (emulator) and walks through every screen and mode,
  # with test keys standing in for the real rescue base.
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Cache speech model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets/model
            app/src/main/assets/model_info.txt
          key: vosk-model-small-en-in-0.4-v1

      - name: Download offline speech model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: ./scripts/fetch_voice_model.sh

      - name: Build the app and the test app
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the smoke test on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 3072M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash scripts/ci_smoke.sh

      - name: Upload test reports and phone log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            logcat.txt
          if-no-files-found: ignore

  # Publishes the APK only when both the build (with unit tests) and the emulator smoke test passed.
  publish:
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Get the tested APK
        uses: actions/download-artifact@v4
        with:
          name: UyirMesh-apk
          path: dist

      - name: Publish APK as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/app-release.apk UyirMesh.apk
          ls -la UyirMesh.apk
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            TAG="v$VERSION"; EXTRA=""; TITLE="UyirMesh v$VERSION (build ${{ github.run_number }})"
          else
            TAG="v$VERSION-dev"; EXTRA="--prerelease"; TITLE="UyirMesh v$VERSION test build (build ${{ github.run_number }})"
          fi
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" UyirMesh.apk $EXTRA --target "${{ github.sha }}" \
            --title "$TITLE" \
            --notes "Signed APK built by GitHub Actions from commit ${{ github.sha }}; passed the unit tests and the on-device smoke test on an Android 14 emulator. Android 8.0 or newer. Install it on every phone (allow installing from unknown sources)."

      - name: Push APK to apk-dist branch
        if: github.ref == 'refs/heads/main'
        run: |
          cp dist/app-release.apk /tmp/UyirMesh.apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan apk-dist
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/UyirMesh.apk UyirMesh.apk
          git add UyirMesh.apk
          git commit -m "APK build ${{ github.run_number }} [skip ci]"
          git push -f origin apk-dist
