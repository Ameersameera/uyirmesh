name: Build APK

# Builds and tests UyirMesh on GitHub's runners (real Android SDK + internet),
# then publishes the signed APK as the "v1.0" release.
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Cache speech model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets/model
            app/src/main/assets/model_info.txt
          key: vosk-model-small-en-in-0.4-v1

      - name: Download offline speech model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: ./scripts/fetch_voice_model.sh

      - name: Refresh model id
        run: python3 -c "import uuid; print(uuid.uuid4())" > app/src/main/assets/model/uuid

      - name: Run core unit tests (mesh, crypto, AI)
        run: gradle :core:test --stacktrace

      - name: Build signed APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UyirMesh-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish APK as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk UyirMesh.apk
          ls -la UyirMesh.apk
          gh release delete v1.0 --cleanup-tag --yes || true
          gh release create v1.0 UyirMesh.apk \
            --title "UyirMesh v1.0 (build ${{ github.run_number }})" \
            --notes "Signed APK built by GitHub Actions from commit ${{ github.sha }}. Android 8.0 or newer. Install it on every phone (allow installing from unknown sources)."

      - name: Push APK to apk-dist branch
        run: |
          cp app/build/outputs/apk/release/app-release.apk /tmp/UyirMesh.apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan apk-dist
          git rm -rf . >/dev/null 2>&1 || true
          cp /tmp/UyirMesh.apk UyirMesh.apk
          git add UyirMesh.apk
          git commit -m "APK build ${{ github.run_number }} [skip ci]"
          git push -f origin apk-dist
