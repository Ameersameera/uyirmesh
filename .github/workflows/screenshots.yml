name: App screenshots

# Runs the same on-device smoke test on a larger emulator screen (Nexus 4 profile, 768 x 1280) and keeps a
# screenshot of each main screen, for the project report and the README. The screenshots are kept as the
# "app-screenshots" artifact and on the "screenshots" branch (replaced on every run).
# It does not build or publish the release (that is "Build APK").
on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/screenshots.yml'
      - 'app/src/androidTest/**'
      - 'scripts/ci_smoke.sh'

permissions:
  contents: write

concurrency:
  group: screenshots
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Cache speech model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: |
            app/src/main/assets/model
            app/src/main/assets/model_info.txt
          key: vosk-model-small-en-in-0.4-v1

      - name: Download offline speech model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: ./scripts/fetch_voice_model.sh

      - name: Build the app and the test app
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the smoke test with screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: Nexus 4
          ram-size: 3072M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: SHOTS=1 bash scripts/ci_smoke.sh

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshots
          path: shots/
          if-no-files-found: warn

      - name: Save screenshots to the screenshots branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! ls shots/*.png >/dev/null 2>&1; then echo "no screenshots"; exit 0; fi
          cd shots
          git init -q -b screenshots
          git add *.png
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "App screenshots from run ${GITHUB_RUN_ID}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screenshots
